name: Build signed APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          BIN=$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | head -1)
          if [ -n "$BIN" ]; then
            yes | "$BIN/sdkmanager" --licenses >/dev/null 2>&1 || true
            "$BIN/sdkmanager" "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 || true
          fi
          ls "$SDK/platforms" 2>/dev/null | tail -3

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "MPVKT_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release (universal + per-ABI)
        env:
          MPVKT_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MPVKT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MPVKT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -x lint

      - name: Collect APKs
        run: |
          mkdir -p out
          find app/build/outputs/apk/release -name '*.apk' -exec cp {} out/ \;
          ls -la out

      - name: Checksums
        run: |
          cd out
          for f in *.apk; do sha256sum "$f" > "$f.sha256"; done
          cat *.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mpvkt-signed-apks
          path: out/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
            gh release edit "$TAG" --notes "Vela $TAG — signed build. sha:${GITHUB_SHA}"
          else
            gh release create "$TAG" out/* --title "Vela $TAG" --notes "Vela $TAG — signed build. sha:${GITHUB_SHA}"
          fi
