name: Vela UI tests

# Runs after the signed build: builds the debug + androidTest APKs, then hands
# them to the reusable emulator workflow and runs connectedDebugAndroidTest.
on:
  workflow_run:
    workflows: ["Build signed APK"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: vela-ui-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apks:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Build debug + androidTest APKs
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest -x lint

      - name: Collect APKs
        run: |
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          ls -la out

      - name: Upload APKs for the emulator job
        uses: actions/upload-artifact@v4
        with:
          name: vela-debug-apk
          path: out/*.apk
          retention-days: 7

  emulator-tests:
    needs: build-debug-apks
    uses: ./.github/workflows/android-emulator-tests.yml
    with:
      apk_path: app/build/outputs/apk/debug/app-debug.apk
      apk_artifact: vela-debug-apk
      test_command: ./gradlew --no-daemon connectedDebugAndroidTest -x lint
      api_level: "34"
      arch: x86_64
      timeout_minutes: 45
